# Builds unsigned installers for Windows, macOS and Linux when a version tag is pushed, and attaches
# them to a draft GitHub Release for that tag. Publish the draft by hand once it looks right.
#
# The tag check runs first, so a mismatched tag stops the release before any installer is built.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:check-tag -- "$GITHUB_REF_NAME"
      - run: npm run typecheck
      # The unit tests read table schemas from the Conquest of AzerothCore fork's base SQL; only
      # that folder is fetched.
      - uses: actions/checkout@v7
        with:
          repository: jealous-sound/azerothcore-wotlk-coa
          path: coa
          sparse-checkout: data/sql/base/db_world
      - run: npm test
        env:
          ACQC_AC_SQL_DIR: ${{ github.workspace }}/coa/data/sql
      # One draft up front, which every build job uploads its installers into.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
            files: dist/*.exe
          - os: macos-latest
            args: --mac --arm64 --x64
            files: dist/*.dmg dist/*.zip
          - os: ubuntu-latest
            args: --linux --x64
            files: dist/*.AppImage dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx electron-vite build
      # electron-builder rebuilds better-sqlite3 for Electron and for each target arch itself.
      # Nothing is uploaded yet: the checks below run first.
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # better-sqlite3 picks prebuilds/<platform>-<arch>.node at run time; each Mac app must carry
      # the binary for its own processor, built for it, or it crashes on launch.
      - name: Check the native module matches each Mac build
        if: runner.os == 'macOS'
        shell: bash
        run: |
          check() {
            local mod
            mod=$(find "$1" -path '*app.asar.unpacked*' -name "$2.node" | head -n 1)
            if [ -z "$mod" ]; then echo "::error::no $2.node under $1"; exit 1; fi
            file "$mod"
            file "$mod" | grep -q "$3" || { echo "::error::$mod is not $3"; exit 1; }
          }
          check dist/mac-arm64 darwin-arm64 arm64
          check dist/mac darwin-x64 x86_64
      - name: Upload the installers to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.files }} --clobber
