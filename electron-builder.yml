appId: local.acore.questcreator
productName: ACORE Quest Creator
directories:
  output: dist
files:
  - out/**
# Drizzle reads its migrations from disk at runtime, so they cannot live inside the asar. The store
# looks for them at `process.resourcesPath/drizzle` once packaged.
extraResources:
  - from: drizzle
    to: drizzle
# better-sqlite3 loads a native .node binary, which cannot be required from inside the asar either.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
# The package name, not productName: release files get no spaces in their names.
artifactName: ${name}-${version}-${os}-${arch}.${ext}
# An unpacked local build uses `npx electron-builder --dir`.
win:
  target:
    - nsis
# Unsigned by choice: people allow it once (Privacy & Security → Open Anyway, or right-click → Open
# before macOS 15).
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  identity: null
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: Daniel Mckibbin <vyrus@fourtwenty.games>
